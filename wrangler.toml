name = "ung-cyber-unit-website"
main = "worker.js"
compatibility_date = "2024-01-01"
workers_dev = false
preview_urls = false
routes = [
  { pattern = "ungcyberunit.org", custom_domain = true },
  { pattern = "www.ungcyberunit.org", custom_domain = true }
]

[assets]
directory = "./public"
binding = "ASSETS"
# Route the HTML pages through the worker so they all get the security headers
# (CSP, X-Frame-Options, etc.); static files would otherwise bypass them. Only
# the pages are listed — CSS/JS/images stay served directly by the asset layer
# (correct MIME, edge-fast). The "/" branch also server-renders the topic grid.
run_worker_first = [ "/", "/start", "/about", "/resources", "/admin", "/instructor", "/kanban", "/profile", "/quiz", "/leaderboard", "/members", "/announcements", "/events", "/feedback", "/contact", "/student-hub", "/log-analysis-challenge", "/network-traffic-challenge", "/challenges", "/lab/web-exploitation-portal", "/lab/staging-notes", "/bot-terms", "/bot-privacy" ]

[[d1_databases]]
binding      = "DB"
database_name = "cyber-unit-db"
database_id  = "f613d6ab-2cc1-43d1-b20b-defe5c968590"

# Deliberately separate database (not just separate tables in DB above) for
# the "Breach the Portal" web-exploitation lab (see docs/plan-intermediate-
# track.md and CLAUDE.md's "Web Exploitation Lab" section). The lab's login
# endpoint is intentionally SQL-injectable — a real vulnerability, not a
# simulation — so it must be physically incapable of reaching real user
# data via a UNION-based injection. Only ever touches this database.
[[d1_databases]]
binding      = "WEBEXPLOIT_DB"
database_name = "cyber-unit-webexploit-db"
database_id  = "0cb3dbe0-4a03-4dd9-a02b-dda15f99750d"

# Discord OAuth client ID (see docs/plan-discord-pairing.md) — not sensitive,
# it's embedded in the public OAuth authorize URL regardless, so it lives
# here rather than as a secret. DISCORD_CLIENT_SECRET does NOT go here —
# that's `wrangler secret put DISCORD_CLIENT_SECRET`.
# Same application as the bot's DISCORD_TOKEN — Discord's Application ID
# and OAuth2 Client ID are the same snowflake, so this is the bot's own id.
[vars]
DISCORD_CLIENT_ID = "1547010558862037124"

# Channel Kanban's assignment/due-date-reminder notifications post into via
# the Discord Bot REST API (src/lib/discord.js) — not sensitive, a channel
# ID alone grants no access without the DISCORD_TOKEN secret alongside it
# (`wrangler secret put DISCORD_TOKEN`, the bot's own token — same one
# cyber_discord_bot uses for its gateway connection). The bot's Discord
# application needs "Send Messages" permission in this channel.
#
# DISCORD_TOKEN is NOT the same value as any other secret already in this
# app, despite similar names — mixed up live once when first setting this
# up, worth being explicit:
#   - DISCORD_TOKEN           = Discord Developer Portal -> your app ->
#     "Bot" tab -> Token (click "Reset Token" if not already visible;
#     Discord only shows it once per reset). This is what goes here.
#   - DISCORD_CLIENT_SECRET   = Developer Portal -> "OAuth2" tab -> Client
#     Secret. Already a separate secret on this Worker — only used by
#     /api/discord/callback's account-linking code exchange, never by
#     sendDiscordMessage().
#   - BOT_API_SECRET          = this app's OWN secret (unrelated to any
#     Discord-issued credential) — what cyber_discord_bot sends back to
#     THIS Worker as X-Bot-Secret when polling /api/bot/progress/:discordId
#     etc. Pasting this into DISCORD_TOKEN fails with a 401 from Discord's
#     API (wrong credential, not a permissions issue).
DISCORD_NOTIFICATIONS_CHANNEL_ID = "1563315905725997056"

# .edu student-verification emails (see /api/auth/verify-email/request in
# worker.js) send via the Resend HTTP API rather than Cloudflare's own Email
# Sending product (paid) — no binding needed, just the RESEND_API_KEY secret
# (`wrangler secret put RESEND_API_KEY`) and a domain verified with Resend.

# Hourly cleanup of expired room-code rate-limit rows (see scheduled() in worker.js)
[triggers]
crons = ["0 * * * *"]

# Workers Logs — free on both Free/Paid plans at this site's traffic volume
# (200k events/day on Free). Captures console.log/error + request metadata
# so prod errors are visible after the fact instead of only during a manual
# `wrangler tail` session. Checked before enabling: no src/ console.error
# call logs a token/password/full request body, only err.message or static
# strings — see CLAUDE.md if adding a new one.
[observability]
enabled = true
