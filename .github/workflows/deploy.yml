name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: npm ci
      - run: npm test
      - name: Deploy Worker + assets
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Pin wrangler to match local dev and be explicit about the command so
          # the Worker *script* is always deployed (not just assets). If the API
          # token lacks "Workers Scripts: Edit" this step fails loudly here.
          wranglerVersion: '4.145.0'
          command: deploy
      - name: Verify the deployed Worker is live
        run: |
          # Hit the production custom domain and confirm the server-rendered
          # pathway is present. Fails the job if not. This used to hit the
          # joshuaacklen.workers.dev subdomain directly to bypass the zone's
          # HTML cache, but the 2026-09-30 Cloudflare account migration moved
          # the site to a new account/subdomain and set workers_dev = false
          # in wrangler.toml, disabling the workers.dev route entirely — that
          # URL has been silently failing on every deploy since. Worker
          # routes aren't HTML-cached by default (no Cache Rules configured),
          # so hitting the real domain directly still reflects the live
          # Worker; a cache-busting query param is added as extra insurance.
          url="https://ungcyberunit.org/start?cachebust=${{ github.sha }}"
          count=$(curl -s --max-time 20 "$url" | grep -c 'pw-stage' || true)
          echo "pw-stage markers on $url: $count"
          if [ "$count" -lt 1 ]; then
            echo "::error::Deployed Worker did not server-render the pathway — deploy likely did not update the Worker script."
            exit 1
          fi
