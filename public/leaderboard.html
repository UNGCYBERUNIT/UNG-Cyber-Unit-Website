<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>CyberUnit @ UNG — Leaderboard</title>
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <!-- ─── Navbar ──────────────────────────────────────────── -->
  <nav class="navbar" role="navigation" aria-label="Main navigation">
    <div class="container">
      <a href="/" class="navbar-logo"><img src="/images/CyberUnitLogo_Transparent.png" alt="CyberUnit @ UNG" class="navbar-logo-img"><span class="navbar-logo-text">[ CyberUnit @ UNG ]</span></a>
      <button class="hamburger" id="hamburger" aria-label="Toggle navigation" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
      <ul class="navbar-links" id="navLinks">
        <li><a href="/">Home</a></li>
        <li><a href="/resources">Resources</a></li>
        <li><a href="/about">About</a></li>
        <li><a href="https://discord.gg/BjU632E7sV" target="_blank" rel="noopener noreferrer" class="btn btn-sm navbar-discord-btn">Discord</a></li>
        <li id="authNavItem"></li>
      </ul>
    </div>
  </nav>

  <main class="page-body">
    <div class="container" style="max-width: 800px; padding: 2rem 1rem;">

      <header style="margin-bottom: 2rem;">
        <h1 style="font-family: 'Share Tech Mono', monospace; color: var(--accent); font-size: 1.6rem; margin: 0 0 0.25rem;">
          // Top Performers
        </h1>
        <p id="lbSubtitle" style="color: var(--text-muted); font-family: 'Share Tech Mono', monospace; font-size: 0.85rem; margin: 0;">
          Ranked by total module-completion points
        </p>
      </header>

      <!-- Shown when not signed in -->
      <div id="loginGate" class="login-gate" hidden>
        <p style="font-size:2rem;margin-bottom:0.75rem;">🔒</p>
        <p style="margin-bottom:1.25rem;">Sign in to view the leaderboard.</p>
        <button class="btn btn-primary" id="loginGateBtn">Sign In</button>
      </div>

      <!-- Shown when signed in -->
      <div id="leaderboardContent" hidden>
        <div class="lb-modes" role="tablist" aria-label="Leaderboard mode">
          <button class="lb-mode-btn is-active" data-mode="modules" role="tab" aria-selected="true">Module Completion</button>
          <button class="lb-mode-btn" data-mode="rooms" role="tab" aria-selected="false">Quiz Rooms</button>
        </div>
        <div id="leaderboardWrap">
          <p style="color: var(--text-muted); font-family: 'Share Tech Mono', monospace;">Loading...</p>
        </div>
      </div>

    </div>
  </main>

  <script type="module" src="/js/main.js"></script>
</body>
</html>
